name: KitchenTempLog
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  KitchenTempLog:
    type: application
    platform: iOS
    sources:
      - path: KitchenTempLog
      - path: Shared
    dependencies:
      - target: KitchenTempLogWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kitchen-temp-log
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: KitchenTempLog/KitchenTempLog.entitlements
    info:
      path: KitchenTempLog/Info.plist
      properties:
        CFBundleDisplayName: Temp Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
  KitchenTempLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: KitchenTempLogWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kitchen-temp-log.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: KitchenTempLogWidget/KitchenTempLogWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: KitchenTempLogWidget/Info.plist
      properties:
        CFBundleDisplayName: Temp Log Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  KitchenTempLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KitchenTempLogTests
    dependencies:
      - target: KitchenTempLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kitchen-temp-log.tests
        GENERATE_INFOPLIST_FILE: YES
  KitchenTempLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KitchenTempLogUITests
    dependencies:
      - target: KitchenTempLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kitchen-temp-log.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KitchenTempLog
schemes:
  KitchenTempLog:
    build:
      targets:
        KitchenTempLog: all
        KitchenTempLogTests: [test]
        KitchenTempLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: KitchenTempLog/StoreKit/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: KitchenTempLog/StoreKit/Products.storekit
      targets:
        - KitchenTempLogTests
        - KitchenTempLogUITests
    archive:
      config: Release
